  <title id="title">Does full bf16 buy us better art?</title><desc id="description">Matched-pair comparison against the same-seed Q8 render; positive means bf16 is higher</desc>
  <rect width="1200" height="760" fill="#07131b"/>
  <text x="62" y="72" fill="#eef8f5" font-family="Inter,Segoe UI,sans-serif" font-size="38" font-weight="750">Does full bf16 buy us better art?</text>
  <text x="62" y="108" fill="#8fb4c4" font-family="Inter,Segoe UI,sans-serif" font-size="17">Matched-pair comparison against the same-seed Q8 render; positive means bf16 is higher</text>
  <rect x="62" y="160" width="345" height="480" rx="18" fill="#0d202a" stroke="#24414d"/><text x="86" y="203" fill="#eef8f5" text-anchor="start" font-family="Inter,Segoe UI,sans-serif" font-size="19" font-weight="700">Aesthetic delta</text><text x="86" y="290" fill="#ffd166" text-anchor="start" font-family="Inter,Segoe UI,sans-serif" font-size="54" font-weight="780">+0.015</text><text x="86" y="318" fill="#8fb4c4" text-anchor="start" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="500">bf16 − Q8 points</text><text x="86" y="380" fill="#eef8f5" text-anchor="start" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="500">95% CI  -0.027 to 0.058</text><text x="86" y="418" fill="#eef8f5" text-anchor="start" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="500">Median  0.014</text><text x="86" y="456" fill="#eef8f5" text-anchor="start" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="500">bf16 higher  57%</text><line x1="86" y1="490" x2="383" y2="490" stroke="#24414d"/><text x="86" y="535" fill="#ff796c" text-anchor="start" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="650">Neither lane wins</text><rect x="437" y="160" width="345" height="480" rx="18" fill="#0d202a" stroke="#24414d"/><text x="461" y="203" fill="#eef8f5" text-anchor="start" font-family="Inter,Segoe UI,sans-serif" font-size="19" font-weight="700">Prompt CLIP delta</text><text x="461" y="290" fill="#76dbc1" text-anchor="start" font-family="Inter,Segoe UI,sans-serif" font-size="54" font-weight="780">-0.003</text><text x="461" y="318" fill="#8fb4c4" text-anchor="start" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="500">bf16 − Q8 cosine</text><text x="461" y="380" fill="#eef8f5" text-anchor="start" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="500">95% CI  -0.010 to 0.004</text><text x="461" y="418" fill="#eef8f5" text-anchor="start" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="500">Median  -0.000</text><text x="461" y="456" fill="#eef8f5" text-anchor="start" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="500">bf16 higher  50%</text><line x1="461" y1="490" x2="758" y2="490" stroke="#24414d"/><text x="461" y="535" fill="#ff796c" text-anchor="start" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="650">Neither lane wins</text><rect x="812" y="160" width="345" height="480" rx="18" fill="#0d202a" stroke="#24414d"/><text x="836" y="203" fill="#eef8f5" text-anchor="start" font-family="Inter,Segoe UI,sans-serif" font-size="19" font-weight="700">Render-time delta</text><text x="836" y="290" fill="#76dbc1" text-anchor="start" font-family="Inter,Segoe UI,sans-serif" font-size="54" font-weight="780">-6.3</text><text x="836" y="318" fill="#8fb4c4" text-anchor="start" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="500">bf16 − Q8 seconds</text><text x="836" y="380" fill="#eef8f5" text-anchor="start" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="500">95% CI  -13.1 to 0.5</text><text x="836" y="418" fill="#eef8f5" text-anchor="start" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="500">Median  -11.0</text><text x="836" y="456" fill="#eef8f5" text-anchor="start" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="500">bf16 slower  7%</text><line x1="836" y1="490" x2="1133" y2="490" stroke="#24414d"/><text x="836" y="535" fill="#ff796c" text-anchor="start" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="650">Operational, not model benchmark</text><text x="62" y="692" fill="#8fb4c4" text-anchor="start" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="500">Matched on subject, art direction, and seed · n = 30 pairs · confidence intervals use paired Student-t estimates</text>
