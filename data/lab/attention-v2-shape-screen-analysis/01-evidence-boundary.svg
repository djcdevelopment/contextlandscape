  <text x="80" y="145" class="s t" font-size="52">What the 9.216M-run screen actually tells us</text><text x="80" y="188" class="s muted" font-size="21">Complete model evidence, invalid commander evidence—and a precise boundary between them.</text>
  <rect x="80" y="245" width="370" height="155" rx="14" fill="#101e2b" stroke="#294157"/><text x="104" y="282" class="s muted" font-size="14" font-weight="700" letter-spacing="2">VERIFIED RUNS</text><text x="104" y="338" class="s t teal" font-size="37">9,216,000</text><text x="104" y="375" class="s muted" font-size="15">all eight shard hashes passed</text><rect x="490" y="245" width="370" height="155" rx="14" fill="#101e2b" stroke="#294157"/><text x="514" y="282" class="s muted" font-size="14" font-weight="700" letter-spacing="2">RULE MODELS</text><text x="514" y="338" class="s t teal" font-size="37">40</text><text x="514" y="375" class="s muted" font-size="15">230,400 paired worlds each</text><rect x="900" y="245" width="370" height="155" rx="14" fill="#101e2b" stroke="#294157"/><text x="924" y="282" class="s muted" font-size="14" font-weight="700" letter-spacing="2">COMMANDER SIGNAL</text><text x="924" y="338" class="s t coral" font-size="37">INVALID</text><text x="924" y="375" class="s muted" font-size="15">profiles were identity-only</text><rect x="1310" y="245" width="370" height="155" rx="14" fill="#101e2b" stroke="#294157"/><text x="1334" y="282" class="s muted" font-size="14" font-weight="700" letter-spacing="2">CURRENT STORAGE</text><text x="1334" y="338" class="s t teal" font-size="37">1.79 GiB</text><text x="1334" y="375" class="s muted" font-size="15">gzip JSONL shards</text><text x="80" y="475" class="s t" font-size="25">Largest paired rule-model shifts vs the v1 bridge</text><text x="80" y="508" class="s muted" font-size="16">Same worlds, fixed policy duel; descriptive sensitivity only.</text><text x="100" y="563" class="m muted" font-size="14">row 16</text><line x1="315" y1="555" x2="735" y2="555" stroke="#263c50"/><line x1="525" y1="541" x2="525" y2="569" stroke="#60788e"/><rect x="335" y="545" width="190" height="20" rx="4" fill="#ff7188"/><text x="760" y="563" class="m t" font-size="14">-0.6317 P1 score</text><text x="100" y="607" class="m muted" f