<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1020" viewBox="0 0 1800 1020" role="img" aria-labelledby="title desc">
  <title id="title">Artifact capacity projection</title><desc id="desc">Measured gzip density projected generously across repeated standard campaigns.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071019"/><stop offset=".55" stop-color="#0b1521"/><stop offset="1" stop-color="#07171b"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#31506a" opacity=".12"/></pattern><style>.s{font-family:Inter,"Segoe UI",Arial,sans-serif}.m{font-family:"Cascadia Mono",Consolas,monospace}.t{fill:#f4f8fc;font-weight:750}.muted{fill:#8da4b9}.teal{fill:#4ff0c5}.amber{fill:#f8d66d}.coral{fill:#ff7188}.line{stroke:#263c50}</style></defs>
  <rect width="1800" height="1020" fill="url(#bg)"/><rect width="1800" height="1020" fill="url(#grid)"/>
  <text x="80" y="80" class="s teal" font-size="17" font-weight="700" letter-spacing="3">CONTEXT LANDSCAPE / EVIDENCE LAB</text>
  <text x="80" y="145" class="s t" font-size="52">Artifact capacity projection</text><text x="80" y="188" class="s muted" font-size="21">Measured gzip density projected generously across repeated standard campaigns.</text>
  <rect x="80" y="240" width="1640" height="92" rx="14" fill="#101e2b" stroke="#294157"/><text x="110" y="278" class="s muted" font-size="15">OBSERVED SHAPE SCREEN</text><text x="110" y="316" class="s teal" font-size="31" font-weight="750">1.79 GiB / 9,216,000 runs</text><text x="90" y="390" class="s t" font-size="24">1×</text><rect x="190" y="362" width="24.9993122610107" height="42" rx="8" fill="#173c35" stroke="#4ff0c5"/><text x="234.9993122610107" y="390" class="m t" font-size="18">7.3 GiB</text><text x="190" y="432" class="s muted" font-size="14">full standard campaigns, including 25% safety margin</text><text x="90" y="515" class="s t" font-size="24">10×</text><rect x="190" y="487" width="249.993122610107" height="42" rx="8" fill="#173c35" stroke="#4ff0c5"/><text x="459.993122610107" y="515" class="m t" font-size="18">72.7 GiB</text><text x="190" y="557" class="s muted" font-size="14">full standard campaigns, including 25% safety margin</text><text x="90" y="640" class="s t" font-size="24">25×</text><rect x="190" y="612" width="625.0171934747324" height="42" rx="8" fill="#173c35" stroke="#4ff0c5"/><text x="835.0171934747324" y="640" class="m t" font-size="18">181.8 GiB</text><text x="190" y="682" class="s muted" font-size="14">full standard campaigns, including 25% safety margin</text><text x="90" y="765" class="s t" font-size="24">50×</text><rect x="190" y="737" width="1250" height="42" rx="8" fill="#173c35" stroke="#4ff0c5"/><text x="1460" y="765" class="m t" font-size="18">363.5 GiB</text><text x="190" y="807" class="s muted" font-size="14">full standard campaigns, including 25% safety margin</text><text x="90" y="910" class="s amber" font-size="18">Projection is deliberately generous. Raw shards are already gzip-compressed; packaging improves portability more than density.</text><text x="80" y="982" class="m muted" font-size="13">ATTENTION V2 • FORENSIC SHAPE SCREEN • NOT SELECTION EVIDENCE</text><text x="1720" y="982" text-anchor="end" class="m muted" font-size="13">sha256:e5963f1257972b145e</text></svg>