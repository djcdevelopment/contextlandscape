<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="179210" viewBox="0 0 1800 179210"><rect width="1800" height="179210" fill="#07131f"/><style>.s{font-family:Segoe UI,Arial,sans-serif}.m{font-family:Consolas,monospace}.t{fill:#ecf7ff}.u{fill:#9fb3c5}</style><text x="70" y="72" class="s t" font-size="34" font-weight="700">Can the last two runs test Desperation Artillery?</text><text x="70" y="108" class="s u" font-size="18">No: the requested action-time state, HE/EMP/Smoke treatments, and immediate outcomes are not jointly observable.</text><text x="70" y="190" class="m t" font-size="15">Progress gap at action time (self &lt;= 6, opponent &gt;= 10)</text><rect x="1280" y="165" width="430" height="36" rx="18" fill="#ff7188"/><text x="1495" y="190" text-anchor="middle" class="m" fill="#07131f" font-size="15" font-weight="700">missing</text><text x="70" y="260" class="m t" font-size="15">Estimated win probability below 15%</text><rect x="1280" y="235" width="430" height="36" rx="18" fill="#ff7188"/><text x="1495" y="260" text-anchor="middle" class="m" fill="#07131f" font-size="15" font-weight="700">missing</text><text x="70" y="330" class="m t" font-size="15">At least three own unverified artifacts</text><rect x="1280" y="305" width="430" height="36" rx="18" fill="#f8d66d"/><text x="1495" y="330" text-anchor="middle" class="m" fill="#07131f" font-size="15" font-weight="700">partial-proxy-only</text><text x="70" y="400" class="m t" font-size="15">Passive verification/do-nothing cohort</text><rect x="1280" y="375" width="430" height="36" rx="18" fill="#f8d66d"/><text x="1495" y="400" text-anchor="middle" class="m" fill="#07131f" font-size="15" font-weight="700">partially-present</text><text x="70" y="470" class="m t" font-size="15">HE / Artifact Exploder on own coordinates</text><rect x="1280" y="445" width="430" height="36" rx="18" fill="#ff7188"/><text x="1495" y="470" text-anchor="middle" class="m" fill="#07131f" font-size="15" font-weight="700">absent-mechanic</text><text x="70" y="540" class="m t" font-size="15">EMP / Smoke against leader units</text><rect x="1280" y="515" width="430" height="36" rx="18" fill="#ff7188"/><text x="1495" y="540" text-anchor="middle" class="m" fill="#07131f" font-size="15" font-weight="700">absent-mechanic</text><text x="70" y="610" class="m t" font-size="15">Immediate same-round drift explosion</text><rect x="1280" y="585" width="430" height="36" rx="18" fill="#ff7188"/><text x="1495" y="610" text-anchor="middle" class="m" fill="#07131f" font-size="15" font-weight="700">missing</text><text x="70" y="680" class="m t" font-size="15">Next-turn progress-gain variance</text><rect x="1280" y="655" width="430" height="36" rx="18" fill="#ff7188"/><text x="1495" y="680" text-anchor="middle" class="m" fill="#07131f" font-size="15" font-weight="700">missing</text><text x="70" y="750" class="m t" font-size="15">Terminal win and final drift</text><rect x="1280" y="725" width="430" height="36" rx="18" fill="#4ff0c5"/><text x="1495" y="750" text-anchor="middle" class="m" fill="#07131f" font-size="15" font-weight="700">present</text></svg>